name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild into its draft (e.g. v1.7.9)'
        required: true
        type: string
  push:
    tags:
      - '*.*.*'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CSC_LINK: ${{ secrets.CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
  WINDOWS_SIGN_TOKEN_ALIAS: ${{ secrets.WINDOWS_SIGN_TOKEN_ALIAS }}
  WINDOWS_SIGN_TOKEN_PASSWORD: ${{ secrets.WINDOWS_SIGN_TOKEN_PASSWORD }}

jobs:
  build:
    # runs-on: macos-latest
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected_tag"
          git log -1 --format='%H %s'
      - name: Prepare packaging tools
        run: |
          for tool in xz rpm; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$tool"
            fi
            "$tool" --version
          done
      - run: echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - run: npm install
      - name: Fix electron-builder keychain unlock on macOS
        run: |
          node - <<'EOF'
          // electron-builder 25 unlocks its temporary keychain with the certificate password, which
          // macOS now checks. Create that keychain with the certificate password: it is the only one
          // the logs may show, and GitHub masks it. electron-builder 26.18 fixes this upstream.
          const fs = require('fs');
          const { createRequire } = require('module');

          const builder = require.resolve('electron-builder', { paths: [process.cwd()] });
          const file = createRequire(builder).resolve('app-builder-lib/out/codeSign/macCodeSign.js');
          const RANDOM = 'const keychainPassword = (0, crypto_1.randomBytes)(32).toString("base64");';
          const FIXED = 'const keychainPassword = cscKeyPassword || (0, crypto_1.randomBytes)(32).toString("base64");';
          const UPSTREAM = ['certPaths, cscPasswords, keychainPassword)', 'keyPasswords, keychainPassword)', '"-k", keychainPassword, keychainFile'];
          const source = fs.readFileSync(file, 'utf8');
          if (source.includes(FIXED) || UPSTREAM.every((marker) => source.includes(marker))) {
            console.log('electron-builder already unlocks its keychain with the right password.');
          } else if (source.split(RANDOM).length === 2) {
            fs.writeFileSync(file, source.replace(RANDOM, FIXED));
            if (!fs.readFileSync(file, 'utf8').includes(FIXED)) throw new Error(`Could not patch ${file}`);
            console.log(`Patched ${file}`);
          } else {
            console.error(`Unexpected electron-builder keychain code in ${file}`);
            process.exit(1);
          }
          EOF
      - name: Validate package file boundaries
        run: |
          node scripts/test-package-files.js
          node scripts/test-package-contents.js
      - name: Prepare fpm
        run: |
          export SZA_PATH="$(node -p "require('7zip-bin').path7za")"
          chmod +x "$SZA_PATH"
          node scripts/ci/patch-fpm-rpm-buildroot.js
      - run: npm run dist
