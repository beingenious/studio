name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild into its draft (e.g. v1.7.9)'
        required: true
        type: string
  push:
    tags:
      - '*.*.*'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CSC_LINK: ${{ secrets.CSC_LINK }}
  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
  WINDOWS_SIGN_TOKEN_ALIAS: ${{ secrets.WINDOWS_SIGN_TOKEN_ALIAS }}
  WINDOWS_SIGN_TOKEN_PASSWORD: ${{ secrets.WINDOWS_SIGN_TOKEN_PASSWORD }}
  BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}

jobs:
  build:
    # runs-on: macos-latest
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected_tag"
          git log -1 --format='%H %s'
      - name: Prepare packaging tools
        run: |
          for tool in xz rpm; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$tool"
            fi
            "$tool" --version
          done
      - run: echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
      - run: npm install
      - run: node scripts/ci/patch-fpm-rpm-buildroot.js
      - run: npm run dist
